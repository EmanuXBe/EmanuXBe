<svg xmlns="http://www.w3.org/2000/svg" width="330" height="40" viewBox="0 0 330 40" role="img" aria-label="LFC: Let's f*cking connect, Let's f*cking code">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 22px; }
    .base { fill: #E6EDF3; }
    .acr  { fill: #E6EDF3; font-weight: 700; letter-spacing: 1px; }
    .dot  { fill: #7D8590; }
    .word { fill: #E0A57A; font-weight: 600; opacity: 0; animation: swap 6s ease-in-out infinite; }
    .w2   { animation-delay: -3s; }
    @keyframes swap {
      0%   { opacity: 0; transform: translateY(8px); }
      8%   { opacity: 1; transform: translateY(0); }
      42%  { opacity: 1; transform: translateY(0); }
      50%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .word { animation: none; }
      .w1 { opacity: 1; }
    }
  </style>
  <text x="178" y="28" text-anchor="end"><tspan class="acr">LFC</tspan><tspan class="dot"> · </tspan><tspan class="base">Let's f*cking</tspan></text>
  <text class="word w1" x="185" y="28">connect 🤝</text>
  <text class="word w2" x="185" y="28">code 💻</text>
</svg>
